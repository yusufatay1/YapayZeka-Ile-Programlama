<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - Neon Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080711;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .bg-glow-purple {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #7c3aed;
            filter: blur(150px);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            opacity: 0.45;
            z-index: 0;
        }

        .bg-glow-blue {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #0284c7;
            filter: blur(160px);
            border-radius: 50%;
            bottom: 15%;
            right: 20%;
            opacity: 0.45;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(18, 16, 38, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-box {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }

        .error-message {
            color: #f87171;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea, #0284c7);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.7), 0 0 35px rgba(2, 132, 199, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .links-container {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
        }

        .links-container a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .links-container a:hover {
            color: #c084fc;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg-glow-purple"></div>
    <div class="bg-glow-blue"></div>

    <div class="card">
        <div class="header">
            <h1>Şifremi Unuttum</h1>
            <p>Sisteme kayıtlı e-posta adresinizi girin. Size sıfırlama bağlantısı göndereceğiz.</p>
        </div>

        <div id="alertBox" class="alert-box alert-success">
            Sıfırlama bağlantısı e-posta adresinize gönderildi!
        </div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="ornek@domain.com">
                </div>
                <div class="error-message" id="emailError">Geçerli bir e-posta adresi giriniz.</div>
            </div>

            <button type="submit" class="btn-submit">Sıfırlama Bağlantısı Gönder</button>
        </form>

        <div class="links-container">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Giriş Sayfasına Dön</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const alertBox = document.getElementById('alertBox');
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!email.value.trim() || !emailRegex.test(email.value.trim())) {
                emailError.style.display = 'block';
                email.style.borderColor = '#f87171';
                alertBox.style.display = 'none';
            } else {
                emailError.style.display = 'none';
                email.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                alertBox.style.display = 'block';
                email.value = '';
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 4000);
            }
        });
    </script>
</body>
</html>
